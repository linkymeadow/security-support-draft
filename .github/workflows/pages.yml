name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - proposal/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out content
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: content
          fetch-depth: 0
          persist-credentials: false

      - name: Check out site design
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test site builder
        run: npm test
        env:
          CONTENT_DIR: ../content

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.mjs --content-dir ../content --base-path "$BASE_PATH" --site-url "$SITE_URL" --out-dir dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
